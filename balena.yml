name: only-cats
type: sw.application
description: >-
  Border Services Agency - preventing contraband entering the cat-flap
assets:
  repository:
    type: blob.asset
    data:
      url: 'https://github.com/belodetek/only-cats'
  logo:
    type: blob.asset
    data:
      url: >-
        https://raw.githubusercontent.com/belodetek/only-cats/master/logo.png
data:
  applicationEnvironmentVariables:
    - TRAEFIK_LOG_LEVEL: INFO
    - CONF_THRESHOLD: 0.70  # YOLO model confidence threshold
  applicationConfigVariables: []
  defaultDeviceType: generic-amd64
  supportedDeviceTypes:
    - generic-amd64
    - generic-aarch64
version: 0.0.0
