# Unit tests (default):
#   docker compose -f docker-compose.test.yml up --build  --force-recreate --remove-orphans --abort-on-container-exit --exit-code-from sut
#   docker compose -f docker-compose.test.yml run --rm --remove-orphans sut
#   docker compose -f docker-compose.test.yml down --volumes
#
# Hardware-in-(the)-Loop (HiL) tests:
#   docker compose -f docker-compose.test.yml --profile HiL up --build --force-recreate --remove-orphans --abort-on-container-exit --exit-code-from sut-hil sut-hil
#   docker compose -f docker-compose.test.yml --profile HiL run --rm --use-aliases sut-hil
#   docker compose -f docker-compose.test.yml --profile HiL down --volumes
---
services:
  sut:
    image: only-cats-sut:latest
    build:
      context: .
      dockerfile: Dockerfile.test
    shm_size: 512m
    depends_on:
      traefik:
        condition: service_healthy
      oauth2-proxy:
        condition: service_healthy
      mock-camera:
        condition: service_healthy
      error-pages:
        condition: service_started
    environment:
      PYTHONPATH: /app/src:/app
      LOG_LEVEL: INFO
      DATA_DIR: /tmp/test-data
      MODEL_WEIGHTS_PATH: /tmp/test-data/nonexistent_weights
      SERIAL_PORT: /dev/null
      TEST_DOMAIN_NAME: iwatch.local.test
      TEST_BALENA_HOST: test-device.balena-devices.com
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./static:/app/static
      - ./traefik/dynamic:/app/traefik/dynamic
    command: >
      pytest -v --tb=short tests/unit
    networks:
      test-net:
        aliases:
          - sut
          - iwatch-ulock

  traefik:
    build:
      context: ./traefik
    command:
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--ping=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--serversTransport.insecureSkipVerify=true"
    environment:
      DOMAIN_NAME: iwatch.local.test
      CAT_CAM_1: mock-camera
      CERT_RESOLVER: "none"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1s
      timeout: 2s
      retries: 15
    networks:
      test-net:
        aliases:
          - iwatch.local.test
          - test-device.balena-devices.com

  error-pages:
    image: python:3.15-slim-bookworm
    command: ["python3", "-m", "http.server", "8080", "--directory", "/static"]
    volumes:
      - ./static:/static:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/error.html')"]
      interval: 1s
      timeout: 2s
      retries: 15
    networks:
      - test-net

  oauth2-proxy:
    image: python:3.15-slim-bookworm
    command:
      - python3
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.headers.get('X-Test-Unauth') == '1':
                    self.send_response(401)
                    self.end_headers()
                    return
                self.send_response(200)
                self.send_header('X-Auth-Request-User', 'test-admin')
                self.end_headers()
            def log_message(self, *a):
                pass
        HTTPServer(('0.0.0.0', 4180), H).serve_forever()
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4180/')"]
      interval: 1s
      timeout: 2s
      retries: 15
    networks:
      - test-net

  mock-camera:
    image: python:3.12-slim-bookworm
    command: ["python3", "/app/app.py"]
    volumes:
      - ./tests/hil/mock-camera/app.py:/app/app.py:ro
      - ./tests/hil/fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 1s
      timeout: 2s
      retries: 15
    networks:
      - test-net

# --- HIL Stack (only started with --profile HiL) ---
  esp32c6-emulator:
    profiles: ["HiL"]
    build:
      context: .
      dockerfile: tests/hil/esp32c6-emulator/Dockerfile
    environment:
      SERIAL_PORT: /run/vserial/ttyACM0
      PYTHONPATH: /app/src:/app
    volumes:
      - ./src:/app/src:ro
      - vserial_run:/run/vserial
      - /dev/pts:/dev/pts
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health')"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - test-net

  sut-hil:
    profiles: ["HiL"]
    image: only-cats-sut:latest
    pull_policy: never
    shm_size: 512m
    depends_on:
      esp32c6-emulator:
        condition: service_healthy
      mock-camera:
        condition: service_healthy
    # required for conftest overrides
    environment:
      CAMERA_PASSWORD: mock-secret
      FIRMWARE_BIN_PATH: /run/vserial/firmware_sketch.ino.bin
      IN_TRAINING: "true"
      LOCKOUT_DURATION_SEC: 5.0
      PYTHONPATH: /app/src:/app
      SERIAL_PORT: /run/vserial/ttyACM0
      SERIAL_RECONNECT_BASE_DELAY_SEC: 0.2
      SERIAL_RECONNECT_MAX_DELAY_SEC: 1.0
      WEBHOOK_SECRET: another-secret
    volumes:
      - ./src:/app/src:ro
      - ./static:/app/static:ro
      - ./tests:/app/tests:ro
      - ./training/runs/latest/weights/:/app/weights:ro
      - /dev/pts:/dev/pts
      - hil_data:/data
      - vserial_run:/run/vserial
    command:
      - /bin/sh
      - -c
      - |
        uvicorn only_cats:app --host 0.0.0.0 --port 8000 &
        APP_PID=$$!
        trap "kill $$APP_PID 2>/dev/null || true" EXIT
        pytest -v --tb=short -m hil tests/hil
    networks:
      - test-net

volumes:
  vserial_run:
  hil_data:

networks:
  test-net:
