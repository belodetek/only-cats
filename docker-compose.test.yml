# docker compose -f docker-compose.test.yml up --build --remove-orphans --abort-on-container-exit --exit-code-from sut
# docker compose -f docker-compose.test.yml run --remove-orphans sut
---
services:
  sut:
    build:
      context: .
      dockerfile: Dockerfile.test
    shm_size: 512m
    depends_on:
      traefik:
        condition: service_healthy
      oauth2-proxy:
        condition: service_healthy
      mock-camera:
        condition: service_started
      error-pages:
        condition: service_started
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /tmp/test-data
      MODEL_WEIGHTS_PATH: /tmp/test-data/nonexistent_weights
      SERIAL_PORT: /dev/null
      TEST_DOMAIN_NAME: iwatch.local.test
      TEST_BALENA_HOST: test-device.balena-devices.com
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./static:/app/static
      - ./traefik/dynamic:/app/traefik/dynamic
    command: >
      pytest -v --tb=short -o asyncio_default_fixture_loop_scope=function tests/
    networks:
      test-net:
        aliases:
          - sut
          - iwatch-ulock

  traefik:
    build:
      context: ./traefik
    command:
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--ping=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--serversTransport.insecureSkipVerify=true"
    environment:
      DOMAIN_NAME: iwatch.local.test
      CAT_CAM_1: mock-camera
      CERT_RESOLVER: "none"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1s
      timeout: 2s
      retries: 15
    networks:
      test-net:
        aliases:
          - iwatch.local.test
          - test-device.balena-devices.com

  error-pages:
    image: python:3.12-slim-bookworm
    command: ["python3", "-m", "http.server", "8080", "--directory", "/static"]
    volumes:
      - ./static:/static:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/error.html')"]
      interval: 1s
      timeout: 2s
      retries: 15
    networks:
      - test-net

  oauth2-proxy:
    image: python:3.12-slim-bookworm
    command:
      - python3
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.headers.get('X-Test-Unauth') == '1':
                    self.send_response(401)
                    self.end_headers()
                    return
                self.send_response(200)
                self.send_header('X-Auth-Request-User', 'test-admin')
                self.end_headers()
            def log_message(self, *a):
                pass
        HTTPServer(('0.0.0.0', 4180), H).serve_forever()
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4180/')"]
      interval: 1s
      timeout: 2s
      retries: 15
    networks:
      - test-net

  mock-camera:
    image: python:3.12-slim-bookworm
    command:
      - python3
      - -c
      - |
        import ssl, subprocess
        from http.server import BaseHTTPRequestHandler, HTTPServer
        subprocess.run(['openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-keyout', '/tmp/k.pem', '-out', '/tmp/c.pem', '-days', '1', '-nodes', '-subj', '/CN=mock-camera'], check=True)
        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header('Content-Type', 'text/html')
                self.end_headers()
                self.wfile.write(f'<h1>Mock Camera ({self.path})</h1>'.encode())
            def log_message(self, *a):
                pass
        httpd = HTTPServer(('0.0.0.0', 443), H)
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain('/tmp/c.pem', '/tmp/k.pem')
        httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
        httpd.serve_forever()
    networks:
      - test-net

networks:
  test-net:
