# docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from sut
---
services:
  sut:
    build: .
    command: >
      sh -c "pip install --no-cache-dir pytest pytest-asyncio httpx2
             pytest -v --tb=short tests/"
    environment:
      LOG_LEVEL: DEBUG
      DATA_DIR: /tmp/test-data
      MODEL_WEIGHTS_PATH: /tmp/test-data/nonexistent_weights
      SERIAL_PORT: /dev/null
    volumes:
      - .:/app
