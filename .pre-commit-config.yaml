repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: ^(prey_runs/.*(\.pt|\.onnx|\.bin)|firmware(_bin)?/.*(\.bin|\.elf|\.map))$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        additional_dependencies:
          - fastapi>=0.110.0
          - httpx>=0.27.0
          - pyserial>=3.5
          - numpy
          - ultralytics
          - opencv-python-headless>=4.8.0

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        # -i 2: indent by 2 spaces, -ci: indent switch cases, -bn: binary ops like && / || like line-breaks
        entry: shfmt -w -s -i 2 -ci
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x # Follow 'source' statements
        language: system
        types: [shell]
