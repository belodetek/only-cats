<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>__CODE__ · __TITLE__ — onlyCat(s)</title>
		<!-- Self-contained styles (no CDN) so error pages render even when the app is down. -->
		<style>
			*, *::before, *::after { box-sizing: border-box; }
			body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
			svg { display: block; }
			.bg-slate-950 { background-color: #020617; }
			.bg-slate-800 { background-color: #1e293b; }
			.text-slate-100 { color: #f1f5f9; }
			.text-slate-400 { color: #94a3b8; }
			.text-sky-400 { color: #38bdf8; }
			.min-h-screen { min-height: 100vh; }
			.flex { display: flex; }
			.flex-col { flex-direction: column; }
			.items-center { align-items: center; }
			.justify-center { justify-content: center; }
			.text-center { text-align: center; }
			.p-6 { padding: 1.5rem; }
			.gap-4 { gap: 1rem; }
			.w-full { width: 100%; }
			.max-w-md { max-width: 28rem; }
			.w-28 { width: 7rem; }
			.h-24 { height: 6rem; }
			.text-5xl { font-size: 3rem; line-height: 1; }
			.text-xl { font-size: 1.25rem; line-height: 1.75rem; }
			.text-sm { font-size: 0.875rem; line-height: 1.25rem; }
			.font-bold { font-weight: 700; }
			.font-semibold { font-weight: 600; }
			.font-medium { font-weight: 500; }
			.tracking-tight { letter-spacing: -0.025em; }
			.rounded-xl { border-radius: 0.75rem; }
			.mt-2 { margin-top: 0.5rem; }
			.px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
			.py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
			.border { border-width: 1px; border-style: solid; }
			.border-slate-700 { border-color: #334155; }
			.cursor-pointer { cursor: pointer; }
			.hover\:bg-slate-700:hover { background-color: #334155; }
		</style>
	</head>
	<body
		class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6"
	>
		<main class="w-full max-w-md text-center flex flex-col items-center gap-4">
			<!-- CC0 Public Domain minimalist cat silhouette -->
			<svg
				role="img"
				aria-label="Cat door closed"
				viewBox="0 0 120 100"
				class="w-28 h-24 text-slate-400"
				fill="none"
				stroke="currentColor"
				stroke-width="3.5"
				stroke-linecap="round"
				stroke-linejoin="round"
			>
				<path d="M26 44 L22 14 L46 30 Q60 26 74 30 L98 14 L94 44 C100 56 96 82 60 84 C24 82 20 56 26 44 Z" />
				<circle cx="46" cy="52" r="3" fill="currentColor" stroke="none" />
				<circle cx="74" cy="52" r="3" fill="currentColor" stroke="none" />
				<path d="M56 62 L60 66 L64 62 M60 66 L60 71 M52 72 Q60 76 68 72" />
			</svg>
			<div id="err-code" class="text-5xl font-bold tracking-tight text-sky-400">__CODE__</div>
			<h1 id="err-title" class="text-xl font-semibold">__TITLE__</h1>
			<p id="err-msg" class="text-sm text-slate-400">__MESSAGE__</p>
			<button
				id="refresh-btn"
				type="button"
				class="mt-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-medium text-slate-100 border border-slate-700 cursor-pointer"
			>
				Refresh
			</button>
		</main>
		<script src="/static/error.js" defer></script>
	</body>
</html>
