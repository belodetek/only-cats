---
http:
  routers:
    redirect-to-https:
      rule: '!HostRegexp(`^.+\.balena-devices\.com$`) && !Header(`X-Forwarded-Proto`, `https`)'
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - redirect-scheme-https
      service: noop@internal

    oauth2-proxy:
      rule: '(HostRegexp(`^.+\.balena-devices\.com$`) || Host(`{{ env "DOMAIN_NAME" }}`)) && PathPrefix(`/oauth2`)'
      entryPoints:
        - web
        - websecure
      priority: 600
      middlewares:
        - balena-https-proto
      service: oauth2-proxy-svc
      tls:
        certResolver: letsencrypt

    dashboard:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      entryPoints:
        - web
      priority: 500
      middlewares:
        - balena-https-proto
        - oauth2-auth
        - dashboard-redirect
      service: api@internal

    cat-cam-1-flv:
      rule: '(HostRegexp(`^.+\.balena-devices\.com$`) || Host(`{{ env "DOMAIN_NAME" }}`)) && PathPrefix(`/flv`)'
      entryPoints:
        - web
        - websecure
      priority: 450
      middlewares:
        - balena-https-proto
      service: cat-cam-1-flv-svc
      tls:
        certResolver: letsencrypt

    cat-cam-1:
      rule: '(HostRegexp(`^.+\.balena-devices\.com$`) || Host(`{{ env "DOMAIN_NAME" }}`)) && PathPrefix(`/cctv1`)'
      entryPoints:
        - web
        - websecure
      priority: 400
      middlewares:
        - balena-https-proto
        - oauth2-auth
        - cam-1-redirect
        - cam-1-strip
      service: cat-cam-1-svc
      tls:
        certResolver: letsencrypt

    cat-cam-1-assets:
      rule: '(HostRegexp(`^.+\.balena-devices\.com$`) || Host(`{{ env "DOMAIN_NAME" }}`)) && (PathPrefix(`/cgi-bin`) || PathPrefix(`/swf`) || PathPrefix(`/js`) || PathPrefix(`/css`) || PathPrefix(`/img`) || PathPrefix(`/fonts`) || Path(`/login.html`) || Path(`/index.html`) || Path(`/favicon.ico`))'
      entryPoints:
        - web
        - websecure
      priority: 400
      middlewares:
        - balena-https-proto
        - oauth2-auth
      service: cat-cam-1-svc
      tls:
        certResolver: letsencrypt

    iwatch-ui:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`) && (Path(`/`) || PathPrefix(`/ui`) || PathPrefix(`/static`) || Path(`/health`))'
      entryPoints:
        - websecure
      priority: 350
      middlewares:
        - oauth2-auth
      service: iwatch-ulock-svc
      tls:
        certResolver: letsencrypt

    iwatch-ublock:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`)'
      entryPoints:
        - websecure
      priority: 300
      service: iwatch-ulock-svc
      tls:
        certResolver: letsencrypt

  middlewares:
    oauth2-auth:
      forwardAuth:
        address: http://oauth2-proxy:4180/
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - Authorization

    redirect-scheme-https:
      redirectScheme:
        scheme: https
        permanent: true

    balena-https-proto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https

    dashboard-redirect:
      redirectRegex:
        regex: '^(https?://[^/]+/dashboard)$'
        replacement: '${1}/'

    cam-1-redirect:
      redirectRegex:
        regex: '^(https?://[^/]+/cctv1)$'
        replacement: '${1}/'

    cam-1-strip:
      stripPrefix:
        prefixes:
          - /cctv1

  services:
    oauth2-proxy-svc:
      loadBalancer:
        servers:
          - url: http://oauth2-proxy:4180

    cat-cam-1-svc:
      loadBalancer:
        servers:
          - url: https://{{ env "CAT_CAM_1" }}:443

    cat-cam-1-flv-svc:
      loadBalancer:
        responseForwarding:
          flushInterval: -1
        servers:
          - url: https://{{ env "CAT_CAM_1" }}:443

    iwatch-ulock-svc:
      loadBalancer:
        servers:
          - url: http://iwatch-ulock:8000
