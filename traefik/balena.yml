---
http:
  routers:
    redirect-to-https:
      rule: '!HostRegexp(`^.+\.balena-devices\.com$`) && !Header(`X-Forwarded-Proto`, `https`)'
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - redirect-scheme-https
      service: noop@internal

    # --- Balena Public URL (*.balena-devices.com) routers on HTTP `web` (TLS terminated by balena-proxy) ---
    balena-oauth2-proxy:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/oauth2`)'
      entryPoints:
        - web
      priority: 600
      middlewares:
        - balena-https-proto
      service: oauth2-proxy-svc

    dashboard:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      entryPoints:
        - web
      priority: 500
      middlewares:
        - balena-https-proto
        - oauth2-auth
        - dashboard-redirect
      service: api@internal

    balena-cat-cam-1-flv:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/flv`)'
      entryPoints:
        - web
      priority: 450
      middlewares:
        - balena-https-proto
      service: cat-cam-1-flv-svc

    balena-cat-cam-1:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/cctv1`)'
      entryPoints:
        - web
      priority: 400
      middlewares:
        - balena-https-proto
        - oauth2-auth
        - cam-1-redirect
        - cam-1-strip
      service: cat-cam-1-svc

    balena-cat-cam-1-assets:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && (PathPrefix(`/cgi-bin`) || PathPrefix(`/swf`) || PathPrefix(`/js`) || PathPrefix(`/css`) || PathPrefix(`/img`) || PathPrefix(`/fonts`) || Path(`/login.html`) || Path(`/index.html`) || Path(`/favicon.ico`))'
      entryPoints:
        - web
      priority: 400
      middlewares:
        - balena-https-proto
        - oauth2-auth
      service: cat-cam-1-svc

    balena-iwatch-ui:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && (Path(`/`) || PathPrefix(`/ui`) || PathPrefix(`/static`) || Path(`/health`))'
      entryPoints:
        - web
      priority: 350
      middlewares:
        - balena-https-proto
        - oauth2-auth
      service: iwatch-ulock-svc

    # --- Custom DOMAIN_NAME routers on HTTPS `websecure` (Let's Encrypt TLS) ---
    domain-oauth2-proxy:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`) && PathPrefix(`/oauth2`)'
      entryPoints:
        - websecure
      priority: 600
      service: oauth2-proxy-svc
      tls:
        certResolver: letsencrypt

    domain-cat-cam-1-flv:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`) && PathPrefix(`/flv`)'
      entryPoints:
        - websecure
      priority: 450
      service: cat-cam-1-flv-svc
      tls:
        certResolver: letsencrypt

    domain-cat-cam-1:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`) && PathPrefix(`/cctv1`)'
      entryPoints:
        - websecure
      priority: 400
      middlewares:
        - oauth2-auth
        - cam-1-redirect
        - cam-1-strip
      service: cat-cam-1-svc
      tls:
        certResolver: letsencrypt

    domain-cat-cam-1-assets:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`) && (PathPrefix(`/cgi-bin`) || PathPrefix(`/swf`) || PathPrefix(`/js`) || PathPrefix(`/css`) || PathPrefix(`/img`) || PathPrefix(`/fonts`) || Path(`/login.html`) || Path(`/index.html`) || Path(`/favicon.ico`))'
      entryPoints:
        - websecure
      priority: 400
      middlewares:
        - oauth2-auth
      service: cat-cam-1-svc
      tls:
        certResolver: letsencrypt

    iwatch-ui:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`) && (Path(`/`) || PathPrefix(`/ui`) || PathPrefix(`/static`) || Path(`/health`))'
      entryPoints:
        - websecure
      priority: 350
      middlewares:
        - oauth2-auth
      service: iwatch-ulock-svc
      tls:
        certResolver: letsencrypt

    iwatch-ublock:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`)'
      entryPoints:
        - websecure
      priority: 300
      service: iwatch-ulock-svc
      tls:
        certResolver: letsencrypt
