---
http:
  routers:
    redirect-to-https:
      rule: '!HostRegexp(`^.+\.balena-devices\.com$`) && !Header(`X-Forwarded-Proto`, `https`)'
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - redirect-scheme-https
      service: noop@internal
    oauth2-proxy:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/oauth2`)'
      entryPoints:
        - web
      priority: 600
      middlewares:
        - balena-https-proto
      service: oauth2-proxy-svc
    dashboard:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      entryPoints:
        - web
      priority: 500
      middlewares:
        - balena-https-proto
        - oauth2-auth
        - dashboard-redirect
      service: api@internal
    cat-cam-1:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/cctv1`)'
      entryPoints:
        - web
      priority: 400
      middlewares:
        - balena-https-proto
        - oauth2-auth
        - cam-1-redirect
        - cam-1-strip
      service: cat-cam-1-svc
    cat-cam-1-flv:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/flv`)'
      entryPoints:
        - web
      priority: 450
      middlewares:
        - balena-https-proto
      service: cat-cam-1-flv-svc
    cat-cam-1-assets:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && (PathPrefix(`/cgi-bin`) || PathPrefix(`/swf`) || PathPrefix(`/js`) || PathPrefix(`/css`) || PathPrefix(`/img`) || PathPrefix(`/fonts`) || Path(`/login.html`) || Path(`/index.html`) || Path(`/favicon.ico`))'
      entryPoints:
        - web
      priority: 400
      middlewares:
        - balena-https-proto
        - oauth2-auth
      service: cat-cam-1-svc
    root-to-cam:
      rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && Path(`/`)'
      entryPoints:
        - web
      priority: 300
      middlewares:
        - balena-https-proto
        - root-redirect
      service: noop@internal
    iwatch-ublock:
      rule: 'Host(`{{ env "DOMAIN_NAME" }}`)'
      entryPoints:
        - websecure
      service: iwatch-ulock-svc
      tls:
        certResolver: letsencrypt
  middlewares:
    oauth2-auth:
      forwardAuth:
        address: http://oauth2-proxy:4180/
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - Authorization
    redirect-scheme-https:
      redirectScheme:
        scheme: https
        permanent: true
    balena-https-proto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
    root-redirect:
      redirectRegex:
        regex: '^https?://([^/]+)/?$'
        replacement: 'https://${1}/cctv1/'
    dashboard-redirect:
      redirectRegex:
        regex: '^(https?://[^/]+/dashboard)$'
        replacement: '${1}/'
    cam-1-redirect:
      redirectRegex:
        regex: '^(https?://[^/]+/cctv1)$'
        replacement: '${1}/'
    cam-1-strip:
      stripPrefix:
        prefixes:
          - /cctv1
  services:
    oauth2-proxy-svc:
      loadBalancer:
        servers:
          - url: http://oauth2-proxy:4180
    cat-cam-1-svc:
      loadBalancer:
        servers:
          - url: https://{{ env "CAT_CAM_1" }}:443
    cat-cam-1-flv-svc:
      loadBalancer:
        responseForwarding:
          flushInterval: -1
        servers:
          - url: https://{{ env "CAT_CAM_1" }}:443
    iwatch-ulock-svc:
      loadBalancer:
        servers:
          - url: http://iwatch-ulock:8000
