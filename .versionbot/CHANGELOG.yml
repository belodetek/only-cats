- commits:
    - subject: "patch: Widen OAuth CSRF cookie lifetime to reduce callback 500s"
      hash: 490e38f2f081e340fde569c419ea42100953ef7b
      body: >
        oauth2-proxy returns HTTP 500 (instead of 403) at /oauth2/callback when
        the

        CSRF cookie is missing -- most commonly because the 5-minute cookie
        expired

        while the user sat on the GitHub consent screen. Widen
        COOKIE_CSRF_EXPIRE to

        15m to shrink that window.


        This mitigates the common (expired-cookie) case only. The upstream
        500-vs-403

        behaviour and the cookies-disabled case live in oauth2-proxy and are
        unchanged.
      footer:
        Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>
        co-authored-by: Claude Opus 4.8 (1M context) <noreply@anthropic.com>
      author: Anton Belodedenko
