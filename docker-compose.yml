# balena-compose
---
version: '2.4'

volumes:
  resin-data: {}

networks:
  only-cats:
    driver: bridge

x-common: &common
  tty: true
  restart: unless-stopped

services:
  # with Gandi ACME config.
  traefik:
    image: traefik@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf  # 3.7.19
    <<: *common
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - only-cats
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # not possible to use env-var(s) in labels in balena-compose
        mkdir -p /etc/traefik
        cat << 'EOF' > /etc/traefik/dynamic.yml
        http:
          routers:
            redirect-to-https:
              rule: '!HostRegexp(`^.+\.balena-devices\.com$`) && !Header(`X-Forwarded-Proto`, `https`)'
              entryPoints:
                - web
              priority: 1000
              middlewares:
                - redirect-scheme-https
              service: noop@internal
            oauth2-proxy:
              rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/oauth2`)'
              entryPoints:
                - web
              priority: 600
              service: oauth2-proxy-svc
            dashboard:
              rule: 'PathPrefix(`/api`) || PathPrefix(`/dashboard`)'
              entryPoints:
                - websecure
              middlewares:
                - dashboard-redirect
              service: api@internal
              tls:
                certResolver: letsencrypt
            dashboard-forwarded:
              rule: '(HostRegexp(`^.+\.balena-devices\.com$`) || Header(`X-Forwarded-Proto`, `https`)) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
              entryPoints:
                - web
              priority: 500
              middlewares:
                - oauth2-auth
                - dashboard-redirect
              service: api@internal
            cat-cam-1:
              rule: 'HostRegexp(`^.+\.balena-devices\.com$`) && PathPrefix(`/cctv1`)'
              entryPoints:
                - web
              priority: 400
              middlewares:
                - oauth2-auth
                - cam-1-redirect
                - cam-1-strip
              service: cat-cam-1-svc
            cat-cam-1-assets:
              rule: '
                HostRegexp(`^.+\.balena-devices\.com$`) && (PathPrefix(`/cgi-bin`) || PathPrefix(`/flv`) || PathPrefix(`/js`) || PathPrefix(`/css`) || PathPrefix(`/img`) || PathPrefix(`/fonts`) || Path(`/login.html`) || Path(`/index.html`))'
              entryPoints:
                - web
              priority: 400
              middlewares:
                - oauth2-auth
              service: cat-cam-1-svc
            # auth. via Public Device URL(s)
            iwatch-balena:
              rule: 'HostRegexp(`^.+\.balena-devices\.com$`)'
              entryPoints:
                - web
              priority: 100
              middlewares:
                - oauth2-auth
              service: iwatch-ulock-svc
            # LAN (via IP), no auth. (HTTP)
            iwatch-lan:
              rule: '!HostRegexp(`^.+\.balena-devices\.com$`)'
              entryPoints:
                - web
              priority: 100
              service: iwatch-ulock-svc
            # LAN, no auth. (HTTPS)
            iwatch:
              rule: 'Host(`{{ env "DOMAIN_NAME" }}`)'
              entryPoints:
                - websecure
              service: iwatch-ulock-svc
              tls:
                certResolver: letsencrypt

          middlewares:
            redirect-scheme-https:
              redirectScheme:
                scheme: https
                permanent: true
            oauth2-auth:
              forwardAuth:
                address: http://oauth2-proxy:4180/oauth2/auth
                trustForwardHeader: true
                authResponseHeaders:
                  - X-Auth-Request-User
                  - X-Auth-Request-Email
                  - Authorization
            dashboard-redirect:
              redirectRegex:
                regex: '^(https?://[^/]+/dashboard)$'
                replacement: '${1}/'
            cam-1-redirect:
              redirectRegex:
                regex: '^(https?://[^/]+/cctv1)$'
                replacement: '${1}/'
            cam-1-strip:
              stripPrefix:
                prefixes:
                  - /cctv1

          services:
            oauth2-proxy-svc:
              loadBalancer:
                servers:
                  - url: http://oauth2-proxy:4180
            cat-cam-1-svc:
              loadBalancer:
                servers:
                  - url: https://{{ env "CAT_CAM_1" }}:443
            iwatch-ulock-svc:
              loadBalancer:
                servers:
                  - url: http://iwatch-ulock:8000
        EOF
        exec traefik \
          --accesslog.fields.headers.defaultmode=keep \
          --accesslog.format=common \
          --accesslog=true \
          --api.dashboard=true \
          --certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=15 \
          --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=gandiv5 \
          --certificatesresolvers.letsencrypt.acme.dnschallenge=true \
          --certificatesresolvers.letsencrypt.acme.email="${ACME_EMAIL}" \
          --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json \
          --entrypoints.web.address=:80 \
          --entrypoints.web.forwardedHeaders.insecure=true \
          --entrypoints.web.http.aliasHeadersStrategy=reject \
          --entrypoints.websecure.address=:443 \
          --entrypoints.websecure.http.aliasHeadersStrategy=reject \
          --metrics.prometheus.addrouterslabels=true \
          --metrics.prometheus.addserviceslabels=true \
          --metrics.prometheus=true \
          --ping.entrypoint=traefik \
          --ping=true \
          --providers.docker.defaultRule='Host(`{{ env "DOMAIN_NAME" }}`) || HostRegexp(`^.+\.balena-devices\.com$`)' \
          --providers.docker.exposedbydefault=false \
          --providers.docker.network=only-cats \
          --providers.docker=true \
          --providers.file.filename=/etc/traefik/dynamic.yml \
          --serversTransport.insecureSkipVerify=true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - resin-data:/letsencrypt
    labels:
      io.balena.features.balena-socket: 1

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048  # v7.15.6
    <<: *common
    networks:
      - only-cats
    expose:
      - 4180
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_AUTH_PREFLIGHT: "true"

  iwatch-ulock:
    build: .
    <<: *common
    command: >
      uvicorn camera_receiver:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    networks:
      - only-cats
    expose:
      - 8000
# FIXME: uncomment when ESP32 is connected
#     devices:
#     - /dev/ttyACM0:/dev/ttyACM0
    environment:
      YOLO_VERBOSE: False
      ULTRALYTICS_AUTOINSTALL: False
    group_add:
      - dialout
    volumes:
      - resin-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # https://github.com/mcuadros/ofelia
  ipurge:
    image: mcuadros/ofelia@sha256:d37e9a4cc2ee15c6eb3f3a640b4f3c2a78ec0207c039dbf456624875281e078b
    command: daemon --docker
    <<: *common
    volumes:
      - resin-data:/data
    labels:
      io.balena.features.balena-socket: 1
      # Run daily at 03:30 AM: delete images & matching labels older than 30 days
      ofelia.job-run.purge-training-data.schedule: "4 2 0 * * *"
      ofelia.job-run.purge-training-data.image: "alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf"  # alpine:3.24.4
      ofelia.job-run.purge-training-data.volume: "${PWD}/data:/data"
      ofelia.job-run.purge-training-data.delete: "true"
      ofelia.job-run.purge-training-data.command: >
        sh -c "find /data/images /data/labels -type f \( -name '*.jpg' -o -name '*.txt' \) -mtime +90 -delete"
