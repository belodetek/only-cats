version: '2.4'

volumes:
  resin-data: {}

networks:
  only-cats:
    driver: bridge

x-common: &common
  tty: true
  restart: unless-stopped

services:
  traefik:
    image: traefik@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf  # 3.7.19
    <<: *common
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      - only-cats
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker=true'
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=iwatch-net
      - --providers.docker.defaultRule=Host(`{{ env "DOMAIN_NAME" }}`)
      - --accesslog=true
      - --accesslog.format=common
      - --api.dashboard=true
      - --metrics.prometheus=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=gandiv5
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=15
    volumes:
      - resin-data:/letsencrypt
    labels:
      io.balena.features.balena-socket: 1
      traefik.enable: true
      traefik.http.middlewares.dashboard-redirect.redirectregex.regex: ^(https?://[^/]+/dashboard)$$
      traefik.http.middlewares.dashboard-redirect.redirectregex.replacement: $${1}/
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.middlewares: dashboard-redirect
      traefik.http.routers.dashboard.rule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.tls: true
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
  iwatch-ulock:
    build: .
    <<: *common
    command: >
      uvicorn camera_receiver:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    networks:
      - only-cats
    expose:
      - 8000
# FIXME: uncomment when ESP32 is connected
#     devices:
#     - /dev/ttyACM0:/dev/ttyACM0
    environment:
      YOLO_VERBOSE: False
      ULTRALYTICS_AUTOINSTALL: False
    group_add:
      - dialout
    volumes:
      - resin-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: true
      traefik.http.routers.iwatch.entrypoints: websecure
      traefik.http.routers.iwatch.tls: true
      traefik.http.routers.iwatch.tls.certresolver: letsencrypt
      traefik.http.services.iwatch.loadbalancer.server.port: 8000

  # https://github.com/mcuadros/ofelia
  ipurge:
    image: mcuadros/ofelia@sha256:d37e9a4cc2ee15c6eb3f3a640b4f3c2a78ec0207c039dbf456624875281e078b
    command: daemon --docker
    <<: *common
    volumes:
      - resin-data:/data
    labels:
      io.balena.features.balena-socket: 1
      # Run daily at 03:30 AM: delete images & matching labels older than 30 days
      ofelia.job-run.purge-training-data.schedule: "4 2 0 * * *"
      ofelia.job-run.purge-training-data.image: "alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf"  # alpine:3.24.4
      ofelia.job-run.purge-training-data.volume: "${PWD}/data:/data"
      ofelia.job-run.purge-training-data.delete: "true"
      ofelia.job-run.purge-training-data.command: >
        sh -c "find /data/images /data/labels -type f \( -name '*.jpg' -o -name '*.txt' \) -mtime +90 -delete"
