[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]
markers = [
    "hil: QEMU Hardware-in-(the)-Loop tests"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::pytest.PytestRemovedIn10Warning"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'src')"
